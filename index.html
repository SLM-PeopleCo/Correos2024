<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Mockups de Gmail 2024</title>
<!-- Importar html2canvas vía CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- Importar Google Material Symbols -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    background: #f0f4f9;
    color: #202124;
    font-size: 15px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    font-size: 20px;
    vertical-align: middle;
  }

  /* ===== Estructura Principal ===== */
  .app-container {
    display: flex;
    flex: 1;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== Panel de Control ===== */
  .control-panel {
    width: 420px;
    background: #ffffff;
    border-right: 1px solid #dadce0;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    box-shadow: 4px 0 15px rgba(0,0,0,0.05);
    z-index: 10;
  }

  .control-panel h2 { margin: 0 0 5px 0; font-size: 22px; color: #1a73e8; font-weight: 500; }
  .control-panel p.subtitle { margin: 0 0 10px 0; font-size: 13.5px; color: #5f6368; }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 13px; font-weight: 600; color: #3c4043; }
  .form-group input, .rich-textarea {
    padding: 12px 14px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
    background: #f8f9fa;
  }
  .form-group input:focus, .rich-textarea:focus {
    outline: none;
    border-color: #1a73e8;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
  }

  /* Textarea Enriquecido */
  .rich-textarea { min-height: 200px; overflow-y: auto; outline: none; }
  .rich-textarea, .body-text { white-space: normal; word-wrap: break-word; line-height: 1.6; }
  .rich-textarea b, .rich-textarea strong, .body-text b, .body-text strong { font-weight: bold !important; }
  .rich-textarea i, .rich-textarea em, .body-text i, .body-text em { font-style: italic !important; }
  .rich-textarea ul, .body-text ul { display: block !important; list-style-type: disc !important; margin: 12px 0 12px 24px !important; padding-left: 16px !important; }
  .rich-textarea ol, .body-text ol { display: block !important; list-style-type: decimal !important; margin: 12px 0 12px 24px !important; padding-left: 16px !important; }
  .rich-textarea li, .body-text li { display: list-item !important; margin-bottom: 6px !important; }
  .rich-textarea p, .body-text p { margin: 0 0 12px 0 !important; }

  .download-btn {
    background: #1a73e8;
    color: white;
    border: none;
    border-radius: 28px;
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.2s;
    margin-top: 10px;
  }
  .download-btn:hover:not(:disabled) { background: #1557b0; }
  .download-btn:disabled { background: #a8c7fa; cursor: not-allowed; }

  /* ===== Contenedor del Preview ===== */
  .preview-container {
    flex: 1;
    overflow-y: auto;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
  }

  /* ===== MOCKUP GMAIL 2024 ===== */
  .gmail-mockup {
    width: 100%;
    max-width: 1366px; 
    background: #f4f7fc;
    overflow: hidden;
  }

  /* Top bar 2024 */
  .topbar {
    display: flex;
    align-items: center;
    height: 64px;
    padding: 0 16px 0 24px;
    gap: 20px;
    background: transparent;
  }
  .menu-icon { color: #5f6368; cursor: pointer; padding: 12px; border-radius: 50%; }
  .logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo-text { font-size: 22px; color: #444746; font-weight: 400; letter-spacing: -0.5px; }
  .search-bar {
    flex: 1;
    max-width: 720px;
    display: flex;
    align-items: center;
    background: #e9eef6;
    border-radius: 28px;
    height: 48px;
    padding: 0 8px;
    color: #444746;
    gap: 10px;
  }
  .search-icon, .tune-icon { padding: 8px; border-radius: 50%; cursor: pointer; color: #444746; }
  .search-bar span.placeholder { flex: 1; color: #444746; font-size: 16px; }
  
  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    color: #444746;
    flex-shrink: 0;
  }
  .status-pill {
    display: flex; align-items: center; gap: 8px;
    background: #ffffff; border-radius: 20px; padding: 6px 12px;
    font-size: 14px; color: #444746; margin-right: 8px;
  }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #1e8e3e; }
  .circle-icon {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #444746; cursor: pointer;
  }
  .avatar-google {
    width: 32px; height: 32px; border-radius: 50%;
    background: #dbe1e8; color: #5f6368;
    display: flex; align-items: center; justify-content: center;
    margin-left: 8px;
  }

  /* Layout 2024 */
  .layout { 
    display: flex; 
    padding: 0 16px 16px 0; 
    gap: 16px; 
    height: calc(100% - 64px);
  }
  
  /* Left Sidebar */
  .sidebar {
    width: 256px;
    flex-shrink: 0;
    padding: 12px 16px 0 16px;
  }
  .compose-btn {
    display: flex; align-items: center; gap: 14px;
    background: #c2e7ff; color: #001d35;
    border-radius: 16px; padding: 16px 24px;
    margin: 0 0 16px 0; font-weight: 500; font-size: 15px;
    width: fit-content;
  }
  .compose-btn .material-symbols-outlined { font-size: 24px; }
  .nav-item {
    display: flex; align-items: center; gap: 18px;
    padding: 0 16px; height: 32px; border-radius: 16px;
    color: #444746; font-size: 14px; margin-bottom: 2px;
  }
  .nav-item.active { background: #d3e3fd; color: #001d35; font-weight: 700; }
  .nav-item .count { margin-left: auto; font-weight: 400; font-size: 12px; color: #444746; }
  .nav-item.active .count { color: #001d35; font-weight: 700; }
  .nav-icon { color: #444746; flex-shrink: 0; font-size: 20px; }
  .nav-item.active .nav-icon { color: #001d35; font-variation-settings: 'FILL' 1; }
  
  .labels-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 16px 8px 16px; color: #444746; font-size: 14px; font-weight: 500;
  }

  /* Main Floating Container 2024 */
  .main {
    flex: 1;
    min-width: 0;
    background: #ffffff;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .toolbar {
    display: flex; align-items: center; gap: 20px;
    padding: 12px 24px; color: #444746;
  }
  .toolbar-icons { display: flex; align-items: center; gap: 20px; }
  .pager { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: #444746; }

  .msg-wrap { padding: 4px 32px 8px 32px; flex: 1; }
  .subject-row { display: flex; align-items: center; gap: 14px; padding: 10px 0 26px 0; }
  .subject-line { font-size: 22px; font-weight: 400; color: #1f1f1f; }
  .chip {
    display: flex; align-items: center; gap: 4px;
    background: #e9eef6; color: #444746; font-size: 12px;
    border-radius: 4px; padding: 2px 6px;
  }
  .chip .material-symbols-outlined { font-size: 14px; }
  .subject-row-icons { margin-left: auto; display: flex; gap: 16px; color: #444746; }

  .msg-header { display: flex; align-items: flex-start; gap: 16px; padding: 4px 0 24px 0; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #007b83; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 500; flex-shrink: 0;
  }
  .msg-header-main { flex: 1; min-width: 0; }
  .sender-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .sender-name { font-size: 14px; font-weight: 700; color: #1f1f1f; }
  .sender-email { font-size: 12px; color: #5f6368; }
  .to-line { font-size: 12px; color: #5f6368; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
  .to-line .material-symbols-outlined { font-size: 16px; }
  
  .msg-header-right {
    display: flex; align-items: center; gap: 16px;
    color: #444746; font-size: 12px; flex-shrink: 0; margin-left: 12px;
  }
